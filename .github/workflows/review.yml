name: Lab Review

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-shell:
    name: ShellCheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck all scripts
        run: |
          set -e
          scripts=$(find . -name '*.sh' -not -path './.git/*')
          if [ -z "$scripts" ]; then
            echo "No shell scripts found."
          else
            shellcheck $scripts
          fi

      - name: Bash syntax check all scripts
        run: |
          set -e
          scripts=$(find . -name '*.sh' -not -path './.git/*')
          for s in $scripts; do
            bash -n "$s"
            echo "OK: $s"
          done
